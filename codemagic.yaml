# Codemagic builds for Eight (bundle ID com.hellopickr.eight). Nothing here touches Pickr.
#
# Workflows
#   ios-release      Builds Eight and uploads it to App Store Connect / TestFlight.
#   ios-screenshots  Runs Eight in the iPhone simulator and saves App Store screenshots
#                    as build artifacts. Uploads nothing to Apple.
#
# Uses the App Store Connect API key integration named "Codemagic"
# (Personal account settings > Integrations > Developer Portal).

definitions:
  prepare_ios: &prepare_ios
    - &install
      name: Install packages
      script: npm install
    - &use_device_fonts
      name: Use the iPhone's built-in fonts (the app makes no network requests)
      script: |
        sed -i '' '/fonts.googleapis.com/d' docs/index.html
        if grep -q "googleapis" docs/index.html; then echo "Google Fonts still referenced"; exit 1; fi
    - &create_ios
      name: Create the iOS project
      script: npx cap add ios
    - &ios_target
      name: iPhone only, minimum iOS 15.0
      script: |
        PBX=ios/App/App.xcodeproj/project.pbxproj
        sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" "$PBX"
        sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "[0-9,]+";/TARGETED_DEVICE_FAMILY = 1;/g' "$PBX"
        if [ -f ios/App/Podfile ]; then
          sed -i '' -E "s/platform :ios, '[0-9.]+'/platform :ios, '15.0'/" ios/App/Podfile
          grep -n "platform :ios" ios/App/Podfile
        fi
        grep -c "IPHONEOS_DEPLOYMENT_TARGET = 15.0;" "$PBX"
        grep -c "TARGETED_DEVICE_FAMILY = 1;" "$PBX"
    - &icons
      name: Generate app icons
      script: npx capacitor-assets generate --ios --iconBackgroundColor '#5b2bd6' --splashBackgroundColor '#5b2bd6'
    - &plist
      name: Configure Info.plist (name, back-tap link, encryption, portrait)
      script: |
        PLIST=ios/App/App/Info.plist
        /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Eight" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Eight" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy \
          -c "Add :CFBundleURLTypes array" \
          -c "Add :CFBundleURLTypes:0 dict" \
          -c "Add :CFBundleURLTypes:0:CFBundleURLName string $BUNDLE_ID" \
          -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
          -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string eight" \
          "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
        /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true
    - &sync
      name: Copy the web app into iOS
      script: npx cap sync ios

workflows:
  ios-release:
    name: Eight iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hellopickr.eight
      vars:
        BUNDLE_ID: com.hellopickr.eight
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - *install
      - *use_device_fonts
      - *create_ios
      - *ios_target
      - *icons
      - *plist
      - *sync
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set version and build number
        script: |
          PBX=ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = 1.0.0;/g" "$PBX"
      - name: Build the app
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-screenshots:
    name: Eight App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      vars:
        BUNDLE_ID: com.hellopickr.eight
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - *install
      - *use_device_fonts
      - *create_ios
      - *ios_target
      - *icons
      - *plist
      - *sync
      - name: Build for the iPhone simulator
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 20
          ls build/sim/Build/Products/Release-iphonesimulator/
      - name: Take screenshots on the largest iPhone
        script: |
          set -e
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro Max" | tail -n 1 | grep -oE "[0-9A-F-]{36}")
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$UDID" build/sim/Build/Products/Release-iphonesimulator/App.app
          APP=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" app)
          cp "$APP/public/index.html" /tmp/eight-index.html
          # Warm-up launch so the first screenshot isn't taken during first-run setup.
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          sleep 10
          n=1
          for view in home add activity plan welcome; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            sed "s#<head>#<head><script>window.__SHOT='$view'</script>#" /tmp/eight-index.html > "$APP/public/index.html"
            grep -c "__SHOT='$view'" "$APP/public/index.html"
            xcrun simctl launch "$UDID" "$BUNDLE_ID"
            sleep 7
            xcrun simctl io "$UDID" screenshot "screenshots/0${n}-${view}.png"
            n=$((n+1))
          done
          cp /tmp/eight-index.html "$APP/public/index.html"
          sips -g pixelWidth -g pixelHeight screenshots/*.png
          md5 screenshots/*.png
      - name: Upload screenshots to the Eight 1.0 draft in App Store Connect
        script: |
          set -e
          mkdir -p fastlane/screenshots/en-US
          cp screenshots/*.png fastlane/screenshots/en-US/
          # A Deliverfile stops deliver from asking setup questions on the build machine.
          printf 'app_identifier("%s")\nplatform("ios")\n' "$BUNDLE_ID" > fastlane/Deliverfile
          export FASTLANE_SKIP_UPDATE_CHECK=1 FASTLANE_HIDE_CHANGELOG=1 CI=true
          python3 - <<'PY'
          import base64, json, os, re
          raw = os.environ["APP_STORE_CONNECT_PRIVATE_KEY"].strip().replace("\\n", "\n")
          if "BEGIN" not in raw:
              try:
                  raw = base64.b64decode(raw).decode()
              except Exception:
                  pass
          body = re.sub(r"-----[^-]+-----", "", raw)
          body = re.sub(r"\s+", "", body)
          lines = [body[i:i+64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          print("Key lines:", len(lines))
          json.dump({
            "key_id": os.environ["APP_STORE_CONNECT_KEY_IDENTIFIER"],
            "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
            "key": pem,
            "in_house": False
          }, open("asc_key.json", "w"))
          PY
          fastlane deliver \
            --api_key_path asc_key.json \
            --app_identifier "$BUNDLE_ID" \
            --platform ios \
            --app_version 1.0 \
            --skip_binary_upload true \
            --skip_metadata true \
            --skip_app_version_update true \
            --overwrite_screenshots true \
            --screenshots_path fastlane/screenshots \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true
          rm -f asc_key.json
    artifacts:
      - screenshots/*.png
