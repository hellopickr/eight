<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Solid purple "spent so far" card leads, bills and the budget sum follow, tab bar pinned to the bottom. */
:root{
  --bg:#ffffff; --surface:#f6f3fd; --line:#e8e2f5; --ink:#1c1430; --muted:#6b6283;
  --brand:#5b2bd6; --brand-ink:#ffffff; --brand-soft:#efe8ff; --brand-text:#4a1fc0;
  --hero:#5b2bd6; --hero-ink:#ffffff; --hero-dim:rgba(255,255,255,.74); --hero-track:rgba(255,255,255,.2);
  --good:#127a52; --good-soft:#e2f5ec; --bad:#c0392b; --bad-soft:#fdeceb; --scrim:rgba(28,20,48,.38); --shadow:0 10px 30px rgba(60,30,140,.14);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110c1c; --surface:#1b1430; --line:#2c2346; --ink:#f3effd; --muted:#a79dc2;
  --brand:#a585ff; --brand-ink:#140c26; --brand-soft:#2a1f4a; --brand-text:#c4adff;
  --hero:#4c22c4; --hero-ink:#ffffff; --hero-dim:rgba(255,255,255,.74); --hero-track:rgba(255,255,255,.18);
  --good:#4cc596; --good-soft:#163428; --bad:#ff7a6b; --bad-soft:#3a1a1a; --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#110c1c; --surface:#1b1430; --line:#2c2346; --ink:#f3effd; --muted:#a79dc2;
  --brand:#a585ff; --brand-ink:#140c26; --brand-soft:#2a1f4a; --brand-text:#c4adff;
  --hero:#4c22c4; --hero-ink:#ffffff; --hero-dim:rgba(255,255,255,.74); --hero-track:rgba(255,255,255,.18);
  --good:#4cc596; --good-soft:#163428; --bad:#ff7a6b; --bad-soft:#3a1a1a; --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%;touch-action:manipulation}
*{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.wordmark{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo{width:32px;height:32px;flex:none;display:block}
.period{font-size:13px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.period svg{width:15px;height:15px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h2 .hi{width:28px;height:28px;border-radius:9px;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center}
h2 .hi svg{width:16px;height:16px}
.page-title{font-size:26px;font-weight:800}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{color:var(--brand-text);font-weight:600;font-size:14px}

/* Hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:22px 22px 18px;box-shadow:var(--shadow)}
.hero .deco{position:absolute;right:-34px;top:-30px;width:170px;height:auto;pointer-events:none;opacity:.9}
.hero .h-label{font-size:13px;font-weight:600;color:var(--hero-dim);letter-spacing:.04em;text-transform:uppercase;position:relative}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,54px);letter-spacing:-.03em;line-height:1.05;margin-top:6px;position:relative;white-space:nowrap;max-width:100%}
.hero .sub{margin-top:4px;color:var(--hero-dim);font-size:15px;position:relative}
.bar{height:10px;border-radius:99px;background:var(--hero-track);margin-top:18px;overflow:hidden;position:relative;display:flex}
.bar > i{display:block;height:100%}
.bar > i.spent{background:var(--hero-ink)}
.bar > i.due{background:rgba(255,255,255,.42)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--hero-dim);margin-top:9px;position:relative}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:8px;height:8px;border-radius:50%;display:inline-block}
.free-pill{position:relative;margin-top:16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:14.5px}
.free-pill svg{width:20px;height:20px}
.free-pill b{font-weight:700}

/* Formula */
.formula{border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.f-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.f-row:last-child{border-bottom:0}
.f-row .lbl{display:flex;align-items:center;gap:10px;min-width:0}
.f-row .lbl svg{width:17px;height:17px;color:var(--muted)}
.f-row .op{display:inline-block;width:14px;color:var(--muted);font-weight:700;text-align:center}
.f-row.sub{font-weight:700}
.f-row.total{font-weight:700;border-bottom:0;border-top:2px solid var(--ink);margin-top:-1px}
.neg{color:var(--bad)}

/* Rows */
.list{display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.tx:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px}
.tx .meta{flex:1;min-width:0}
.tx .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tx .t2{font-size:13px;color:var(--muted);display:block}
.tx .amt{font-weight:700;text-align:right}
.tx .amt.in{color:var(--good)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:99px;vertical-align:1px}
.tag.paid{background:var(--good-soft);color:var(--good)}
.tag.auto{background:var(--brand-soft);color:var(--brand-text)}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.daygroup{margin-top:18px}
.daygroup .label{margin-bottom:2px}
.empty{padding:22px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--brand-soft);color:var(--brand-text);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;margin-bottom:14px}
.banner button{font-weight:700;white-space:nowrap}

.wrap-card{border:1.5px solid var(--brand);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:16px;background:var(--bg)}
.wrap-card .top{display:flex;gap:12px;align-items:flex-start}
.wrap-card .ico{background:var(--brand);color:var(--brand-ink)}
.wrap-card .amt-big{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;color:var(--brand-text);line-height:1.1;white-space:nowrap;max-width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Breakdown */
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;padding:7px 0}
.cat-row .ico{width:30px;height:30px;border-radius:10px}
.cat-row .ico svg{width:16px;height:16px}
.cat-row .track{grid-column:2/-1;height:7px;border-radius:99px;background:var(--bg);overflow:hidden}
.cat-row .track i{display:block;height:100%;border-radius:99px}

/* Panels & forms */
.panel{background:var(--surface);border-radius:18px;padding:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;min-width:0}
.input:focus{border-color:var(--brand)}
.money{position:relative;min-width:0}
.money .input{padding-left:54px}
.money em{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:600;color:var(--muted);font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1;flex:none}
.icon-btn:hover{background:var(--line)}

.bill-card{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bill-card .r1{display:flex;gap:10px;align-items:center}
.bill-card .r1 .input{flex:1}
.bill-card .r2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.bill-card .r2 .input{padding-block:10px}

.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:42px;height:25px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + .knob{background:var(--brand)}
.switch input:checked + .knob::after{transform:translateX(17px)}
.switch input:focus-visible + .knob{outline:2px solid var(--brand);outline-offset:2px}
.switch small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);color:var(--brand-ink);width:100%}
.btn.primary.auto{width:auto}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.soft{background:var(--brand-soft);color:var(--brand-text)}
.btn.ghost{color:var(--brand-text)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.btn.xs{padding:6px 11px;font-size:13px;border-radius:9px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px 7px 9px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.plain{padding:7px 12px}

/* Tab bar & FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand-text)}
.fab{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-22px}
.fab svg{width:26px;height:26px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:24px 24px 0 0;max-height:94%;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.seg{display:inline-flex;background:var(--surface);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.amt-disp{font-family:var(--f-display);font-weight:800;font-size:46px;letter-spacing:-.03em;text-align:center;padding:10px 0 4px;white-space:nowrap;overflow:hidden}
.amt-disp .cur{font-size:22px;color:var(--muted);margin-right:6px;font-weight:700}
.cur-pick{position:relative;display:inline-flex;align-items:center;gap:2px;font-size:22px;color:var(--muted);margin-right:8px;font-weight:700;vertical-align:middle;padding:4px 8px;border-radius:12px;background:var(--surface)}
.cur-pick svg{width:16px;height:16px}
.cur-pick{font-family:inherit;border:0;cursor:pointer}
.cur-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.cur-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cur-btn svg{width:18px;height:18px;flex:none;color:var(--muted)}
.cp-scrim{z-index:60}
.cp{height:88%;display:flex;flex-direction:column;gap:10px}
.cp .sheet-head h2{margin:0}
.cp-list{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.cp-h{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:14px 4px 6px}
.cp-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 8px;border:0;background:none;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.cp-row b{min-width:44px;font-weight:800}
.cp-row span{flex:1;color:var(--muted)}
.cp-row svg{width:18px;height:18px;color:var(--accent)}
.cp-row[aria-pressed="true"]{background:var(--surface);border-radius:12px}
.conv{text-align:center;font-size:13px;color:var(--accent);font-weight:600;min-height:0}
.conv:empty{display:none}
.after{text-align:center;font-size:13.5px;color:var(--muted);min-height:20px;margin-bottom:10px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.key{height:54px;border-radius:14px;background:var(--surface);font-family:var(--f-display);font-size:24px;font-weight:700;display:grid;place-items:center}
.key:active{background:var(--brand-soft)}
.key svg{width:24px;height:24px}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-scroll .chip{flex:none}
.daterow{display:flex;gap:8px;align-items:center;margin-top:10px}
.daterow .input{padding:8px 10px;font-size:14px;flex:1}
.icon-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.icon-grid button{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;max-width:100%}
.icon-grid button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.toast-act{color:var(--bg);font-weight:800;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* Savings progress */
.prog{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}

/* Onboarding */
.ob{max-width:480px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px 32px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.ob-top{display:flex;align-items:center;gap:12px;min-height:36px}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:5px;flex:1;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--brand)}
.ob h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.ob .lede{color:var(--muted);font-size:16px;max-width:40ch;margin:0}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:6px}
.choice .ico{width:34px;height:34px;border-radius:11px;background:var(--brand-soft);color:var(--brand-text)}
.choice .ico svg{width:18px;height:18px}
.choice small{font-weight:400;color:var(--muted);font-size:13px}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.welcome-hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:26px 22px;position:relative;overflow:hidden}
.welcome-hero .deco{position:absolute;right:-30px;bottom:-40px;width:190px;height:auto}
.eq{display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-size:20px;font-weight:700;position:relative}
.eq span{color:var(--hero-dim);font-weight:500}
.eq .res{border-top:2px solid rgba(255,255,255,.5);padding-top:8px;margin-top:4px;font-size:23px}
.callout{background:var(--brand-soft);color:var(--brand-text);border-radius:14px;padding:12px 14px;font-size:14.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.callout svg{width:18px;height:18px;flex:none;margin-top:2px}
.spacer{flex:1}
.result-num{font-family:var(--f-display);font-weight:800;font-size:52px;letter-spacing:-.03em;color:var(--brand-text);line-height:1}

ol.guide{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ol.guide li::marker{color:var(--brand-text);font-weight:700}
.codebox{display:flex;gap:8px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.codebox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.cat-edit{display:flex;gap:10px;align-items:center}
.cat-edit .input{flex:1}
.cat-edit .ico{border:0}
:root{--accent:var(--brand-text)}

/* Home: three boxes fill the first screen (2/5, 1/5, 2/5); details scroll below */
.home3{display:flex;flex-direction:column;gap:10px;min-height:calc(100svh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.home3.banner-on{min-height:calc(100svh - 204px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.home3 > section{position:relative;overflow:hidden;border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;min-height:min-content}
.home3 .lab{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;position:relative}
.home3 .amt{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em;line-height:1;white-space:nowrap;max-width:100%;position:relative}
.home3 .amt small{font-size:.4em;letter-spacing:0;font-weight:700;margin-right:.2em;vertical-align:.14em;opacity:.85}
.home3 .amt small.suf{margin:0 0 0 .2em}
.home3 .deco{position:absolute;right:-30px;bottom:-58px;width:150px;opacity:.55;pointer-events:none}
.hb1{flex:2 1 0;background:linear-gradient(150deg,#6a35f0 0%,#5b2bd6 55%,#4a1fc0 100%);color:#fff;box-shadow:0 12px 30px rgba(74,31,192,.26)}
.hb1 .row{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative}
.hb1 .row > div{min-width:0;flex:1}
.hb1 .amt{font-size:clamp(40px,12.5vw,52px);margin-top:10px}
.hb1 .of{margin-top:8px;font-size:15px;color:rgba(255,255,255,.8)}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring .c span{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1}
.ring .c small{font-family:var(--f-body);font-size:11.5px;font-weight:600;opacity:.8;margin-top:3px}
.hb1 .foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;position:relative}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:8px 14px;font-size:16px;font-weight:600;background:rgba(255,255,255,.16)}
.pill svg{width:18px;height:18px}
.hb2{flex:1 1 0;background:var(--brand-soft);flex-direction:row!important;align-items:center;gap:14px}
.hb2 .icon{width:52px;height:52px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.hb2 .icon svg{width:25px;height:25px}
.hb2 .txt{flex:1;min-width:0}
.hb2 .txt b{display:block;font-size:19px;color:var(--ink);line-height:1.2;white-space:nowrap}
.hb2 .txt span{display:block;font-size:15.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.hb2 .amt{font-size:clamp(34px,11vw,46px);color:var(--brand-text)}
.hb2.over{background:var(--bad-soft)}
.hb2.over .icon{background:var(--bad);color:#fff}
.hb2.over .amt{color:var(--bad)}
.hb3{flex:2 1 0;background:linear-gradient(160deg,#241552 0%,#1a0f3d 100%);color:#fff;box-shadow:0 12px 30px rgba(26,15,61,.28)}
.hb3 .top{display:flex;justify-content:space-between;align-items:center;position:relative}
.hb3 .vic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#e8dcff}
.hb3 .vic svg{width:22px;height:22px}
.hb3 .amt{font-size:clamp(38px,12vw,48px);margin-top:10px;color:#fff}
.hb3 .meta{margin-top:8px;font-size:15px;color:rgba(255,255,255,.72);position:relative}
.hb3 .acts{margin-top:auto;padding-top:12px;display:flex;gap:8px;position:relative}
.hb3 .acts button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 8px;border-radius:14px;font-weight:700;font-size:15px;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.hb3 .acts button.solid{background:#fff;color:#2a1670}
.hb3 .acts button:disabled{opacity:.5}
.hb3 .acts svg{width:18px;height:18px}
.hb3 .auto{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:rgba(255,255,255,.75);width:100%;text-align:left;position:relative}
.hb3 .auto b{color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.hb3 .auto svg{width:15px;height:15px;transform:rotate(-90deg)}
.hb3 .auto.due{color:#fff;font-weight:600}
.hb3 .auto.due b{background:#fff;color:#2a1670;border-radius:99px;padding:5px 10px}
.scroll-hint{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--muted);font-size:13px;font-weight:600;padding:12px 0 0;width:100%}
.scroll-hint svg{width:15px;height:15px}
.me-card{border-radius:22px;background:linear-gradient(160deg,#241552,#1a0f3d);color:#fff;padding:18px}
.me-card .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.me-card .amt{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;line-height:1;margin-top:8px;white-space:nowrap}
.me-card .amt small{font-size:.42em;margin-right:.2em;vertical-align:.14em;letter-spacing:0}
.me-card p{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,.72)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hb3,:root:not([data-theme="light"]) .me-card{background:linear-gradient(160deg,#2c1b63 0%,#1e1247 100%);border:1px solid #3a2a72}}
:root[data-theme="dark"] .hb3,:root[data-theme="dark"] .me-card{background:linear-gradient(160deg,#2c1b63 0%,#1e1247 100%);border:1px solid #3a2a72}
details.adds{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
details.adds summary{list-style:none;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
details.adds summary::-webkit-details-marker{display:none}
details.adds summary > svg{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details.adds[open] summary > svg{transform:rotate(180deg)}
details.adds .formula{margin-top:12px}

/* Header profile button */
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
.prof-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);flex:none}
.prof-btn svg{width:20px;height:20px}
.prof-btn[aria-current="page"]{color:var(--brand-text);background:var(--brand-soft)}

/* Vaults */
.hero-btns{position:relative;display:flex;gap:8px;margin-top:16px}
.hero-btns button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;white-space:nowrap;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14.5px}
.hero-btns button.solid{background:#fff;color:#4a1fc0}
.hero-btns svg{width:18px;height:18px}
.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:14px 16px}
.vcard .r1{display:flex;align-items:center;gap:12px;min-width:0}
.vcard .ico{background:var(--brand-soft);color:var(--brand-text)}
.vcard .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.vcard .nm b{overflow-wrap:anywhere;line-height:1.25}
.vcard .nm small{font-size:13px;color:var(--muted)}
.vcard .bal{font-family:var(--f-display);font-weight:800;font-size:20px;white-space:nowrap}
.vcard .ln{font-size:13px;color:var(--muted)}
.vcard .prog{height:8px}
.vault-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:16px}
.vault-row .ico{background:var(--brand-soft);color:var(--brand-text)}
.vault-row .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.vault-row .meta small{color:var(--muted);font-size:13px}
.vault-row .amt{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap}
.vault-row > svg{width:18px;height:18px;color:var(--muted);transform:rotate(-90deg)}
.mv-amt{font-family:var(--f-display);font-weight:800;font-size:30px;padding-block:12px}
.big-bal{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.02em;color:var(--brand-text);white-space:nowrap;max-width:100%;line-height:1.1}

/* Charts */
.chart{display:flex;align-items:stretch;gap:6px;height:170px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:0;border-radius:10px}
.chart .plot{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-height:0}
.chart .v{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.chart .bars{width:100%;max-width:40px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 3px 3px;overflow:hidden;min-height:3px;background:var(--line)}
.chart .bars i{display:block;width:100%;flex:none}
.chart .bars i.a{background:var(--brand)}
.chart .bars i.b{background:color-mix(in srgb, var(--brand) 42%, var(--bg))}
.chart .m{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chart .col.dim .bars{opacity:.5}
.chart .col.sel .m,.chart .col.sel .v{color:var(--brand-text)}
.hero-btns button:disabled{opacity:.5;cursor:default}
.chart .col.now .bars{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.18) 5px 9px)}
.chart-legend{display:flex;gap:6px 14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend b{width:9px;height:9px;border-radius:3px;display:inline-block}
.delta{font-size:12.5px;font-weight:700;white-space:nowrap}
.delta.up{color:var(--bad)}
.delta.down{color:var(--good)}
.delta.flat{color:var(--muted)}
.cmp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.cmp-head .tot{font-family:var(--f-display);font-weight:800;font-size:24px;white-space:nowrap}
.cmp-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0}
.cmp-row .ico{width:30px;height:30px;border-radius:10px}
.cmp-row .ico svg{width:16px;height:16px}
.cmp-row .amt{display:flex;flex-direction:column;align-items:flex-end;font-weight:700}
.cmp-row .track{grid-column:2/-1;height:7px;border-radius:99px;background:var(--bg);overflow:hidden;position:relative}
.cmp-row .track i{display:block;height:100%;border-radius:99px}
.cmp-row .track u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}
</style>
</head>

function migrate(s){
  if(s.v===1){

    if(s.savings) s.savings.saved = s.savings.saved || 0;
    s.lastPeriod=''; s.wrap=null; s.v=2;

// Security: saved data and pasted backups are checked field by field, so a crafted backup
// can never carry code or broken values into the app. Anything unexpected is reset or dropped.
function sanitize(s){
  const MAX = 1e10;
  const str = (v, n=80) => (typeof v==='string' ? v : v==null ? '' : String(v)).replace(/[\u0000-\u001f\u007f]/g,'').slice(0,n);
  const money = v => { const n=+v; return isFinite(n) && n>=0 ? Math.min(Math.round(n*100)/100, MAX) : 0; };
  const int = (v,lo,hi,d) => { const n=Math.round(+v); return isFinite(n) ? Math.min(hi,Math.max(lo,n)) : d; };
  const okId = v => typeof v==='string' && /^[A-Za-z0-9_-]{1,40}$/.test(v);
  const okDate = v => typeof v==='string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseYmd(v));
  const okColor = v => typeof v==='string' && /^#[0-9a-fA-F]{6}$/.test(v);
  const okCur = v => typeof v==='string' && /^[A-Z]{3}$/.test(v) && !!BUILTIN_RATES.r[v];
  const obj = v => v && typeof v==='object' && !Array.isArray(v) ? v : {};
  const out = freshState();
  out.v = 3;
  out.setup = s.setup===true; out.sample = s.sample===true;
  out.obStep = int(s.obStep,0,10,0);
  out.currency = okCur(s.currency) ? s.currency : 'AED';
  out.income = money(s.income);
  out.payday = int(s.payday,1,31,1);
  const idMap = {};
  const fixId = v => { if(okId(v)) return v; const k=String(v); return idMap[k] || (idMap[k]=uid()); };
  const okIcon = v => typeof v==='string' && Object.prototype.hasOwnProperty.call(P,v);
  // Vaults (version 3). Older data had one "savings" goal: it becomes the first vault, and what was
  // already saved becomes that vault's opening balance.
  out.vmoves = [];
  if(Array.isArray(s.vaults)){
    out.vaults = s.vaults.slice(0,30).filter(v=>v&&typeof v==='object').map(v=>({
      id:fixId(v.id), name:str(v.name,40), icon: okIcon(v.icon)?v.icon:'coins', target:money(v.target), months:int(v.months,1,600,12), monthly:money(v.monthly)
    }));
  } else {
    const sv = obj(s.savings);
    const goal = str(sv.goal,40);
    const g = GOALS.find(x=>x.k===goal);
    const v = {id:uid(), name:goal||(s.setup===true?'Savings':''), icon:g?g.i:'coins', target:money(sv.target), months:int(sv.months,1,600,12), monthly:money(sv.monthly)};
    out.vaults = [v];
    if(money(sv.saved)>0) out.vmoves.push({id:uid(), vault:v.id, type:'open', amount:money(sv.saved), date:ymd(today0()), note:'', ts:Date.now()});
  }
  if(!out.vaults.length) out.vaults = [newVault(s.setup===true?'Savings':'')];
  const vIds = new Set(out.vaults.map(v=>v.id));
  const MOVE_TYPES = ['open','in','out','plan','left'];
  if(Array.isArray(s.vmoves)){
    out.vmoves = s.vmoves.slice(0,50000).filter(m=>m&&typeof m==='object' && okDate(m.date) && money(m.amount)>0).map(m=>{
      const x = {id:fixId(m.id), vault:fixId(m.vault), type: MOVE_TYPES.includes(m.type)?m.type:'in', amount:money(m.amount), date:m.date, note:str(m.note,60), ts: isFinite(+m.ts)?+m.ts:0};
      if(m.budget===true && (x.type==='in'||x.type==='out')) x.budget=true;
      return x;
    }).filter(m=>vIds.has(m.vault));
  }
  const cats = (Array.isArray(s.categories)?s.categories:[]).slice(0,60).filter(c=>c&&typeof c==='object').map((c,i)=>({
    id:fixId(c.id), name:str(c.name,40)||'Untitled', icon: (typeof c.icon==='string' && Object.prototype.hasOwnProperty.call(P,c.icon)) ? c.icon : 'dots',
    color: okColor(c.color) ? c.color : PALETTE[i%PALETTE.length], ...(c.sys==='bills'?{sys:'bills'}:{})
  }));
  out.categories = cats.length ? cats : defaultCats();
  const catIds = new Set(out.categories.map(c=>c.id));
  const fallbackCat = (out.categories.find(c=>c.name==='Other')||out.categories[0]).id;
  out.fixed = (Array.isArray(s.fixed)?s.fixed:[]).slice(0,200).filter(b=>b&&typeof b==='object').map(b=>({
    id:fixId(b.id), name:str(b.name,60), amount:money(b.amount), due:int(b.due,1,31,1), auto:b.auto===true, ...(b.off===true?{off:true}:{})
  }));
  const billIds = new Set(out.fixed.map(b=>b.id));
  out.tx = (Array.isArray(s.tx)?s.tx:[]).slice(0,50000).filter(t=>t&&typeof t==='object' && okDate(t.date) && money(t.amount)>0).map(t=>{
    const cat = fixId(t.cat);
    const x = {id:fixId(t.id), type: t.type==='in'?'in':'spend', amount:money(t.amount), cat: catIds.has(cat)?cat:fallbackCat, date:t.date, note:str(t.note,60), ts: isFinite(+t.ts)?+t.ts:0};
    if(t.auto===true) x.auto=true;
    if(t.billId!=null){ const bid=fixId(t.billId); if(billIds.has(bid)) x.billId=bid; }
    if(t.source==='applepay') x.source='applepay';
    if(t.merchant!=null) x.merchant=str(t.merchant,60);
    const o=obj(t.orig);
    if(okCur(o.cur) && money(o.amount)>0 && +o.rate>0 && isFinite(+o.rate)) x.orig={amount:money(o.amount), cur:o.cur, rate:+o.rate};
    return x;
  });
  out.lastCat = okId(s.lastCat) && catIds.has(s.lastCat) ? s.lastCat : undefined;
  out.lastPeriod = okDate(s.lastPeriod) ? s.lastPeriod : '';
  const w = s.wrap && typeof s.wrap==='object' ? s.wrap : null;
  const signed = v => { const n=+v; return isFinite(n) ? Math.max(-MAX, Math.min(MAX, Math.round(n*100)/100)) : 0; };
  out.wrap = w ? {label:str(w.label,60), leftover:signed(w.leftover), planned:money(w.planned), auto:w.auto===true, total:money(w.total!=null?w.total:Math.max(0,(+w.leftover||0)+(+w.planned||0)))} : null;
  // Month end: 'ask' shows a prompt; 'auto' moves the amount into the chosen vault on payday.
  out.monthEnd = s.monthEnd==='auto' ? 'auto' : 'ask';
  out.autoVault = (s.autoVault!=null && vIds.has(fixId(s.autoVault))) ? fixId(s.autoVault) : out.vaults[0].id;
  out.recentCurs = (Array.isArray(s.recentCurs)?s.recentCurs:[]).filter(okCur).slice(0,4);
  out.merchantCats = {};
  const mc = obj(s.merchantCats);
  for(const k of Object.keys(mc).slice(0,2000)){ const v=mc[k]; if(okId(v) && catIds.has(v)) out.merchantCats[str(k,60).toLowerCase()] = v; }
  return out;
}

function pickCurrency(current, onPick){

    q = q.trim().toLowerCase();

      const recent = (S.recentCurs||[]).filter(c=>ALL_CURRENCIES.includes(c));

        const name = curName(c).toLowerCase(), alias = CUR_ALIASES[c]||'', code = c.toLowerCase();
        const words = ' '+alias+' ';
        const score = code===q ? 0 : words.includes(' '+q+' ') ? 1 : code.startsWith(q) ? 2 : name.startsWith(q) ? 3 : words.includes(' '+q) ? 4 : name.includes(q) ? 5 : alias.includes(q) ? 6 : -1;
        return [c, score];
      }).filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1] || a[0].localeCompare(b[0])).map(x=>x[0]);
      list.innerHTML = hits.length ? group('Results', hits) : `<p class="muted" style="text-align:center;padding:24px 0">No currency matches “${esc(q)}”.</p>`;
    }

}

        if(!res.ok) continue;
        const j = await res.json();
        const src = j && j.usd; if(!src || !j.date) continue;
        const r = {};
        // Only plain numbers within 10x of the built-in rate are accepted, so a broken or tampered
        // rates file can't produce absurd conversions. Anything else falls back to the built-in rate.
        for(const c of ALL_CURRENCIES){ const v = +src[c.toLowerCase()], b = BUILTIN_RATES.r[c]; if(v>0 && isFinite(v) && v/b < 10 && b/v < 10) r[c]=v; }
        if(r.USD!==1 || Object.keys(r).length < 100) continue;
        RATES = {date:String(j.date).slice(0,10), fetched:Date.now(), r};
        try{ localStorage.setItem(RATES_KEY, JSON.stringify(RATES)); }catch(e){}
        return true;
      }catch(e){}
    }
    return false;
  } finally { ratesBusy = false; }
}
// Which currency a payment amount is in, e.g. "€12.50", "USD 5.99", "د.إ.‏ ١٢٫٥٠".
const CUR_SIGNS = [['د.إ','AED'],['ر.س','SAR'],['ر.ق','QAR'],['د.ك','KWD'],['د.ب','BHD'],['ر.ع','OMR'],['ج.م','EGP'],['د.أ','JOD'],
  ['US$','USD'],['CA$','CAD'],['C$','CAD'],['A$','AUD'],['AU$','AUD'],['NZ$','NZD'],['S$','SGD'],['HK$','HKD'],['R$','BRL'],['MX$','MXN'],
  ['€','EUR'],['£','GBP'],['₹','INR'],['¥','JPY'],['₩','KRW'],['₱','PHP'],['₺','TRY'],['₦','NGN'],['₽','RUB'],['฿','THB'],['₫','VND'],['₪','ILS'],['₴','UAH'],['₸','KZT'],['₨','PKR'],
  ['Dhs','AED'],['Dh','AED'],['SR','SAR'],['QR','QAR'],['KD','KWD'],['BD','BHD'],['RO','OMR']];
function detectCurrency(str){
  const s = String(str||'');
  for(const code of (s.toUpperCase().match(/[A-Z]{3}/g)||[])) if(ALL_CURRENCIES.includes(code)) return code;
  for(const [sign,code] of CUR_SIGNS) if(s.includes(sign)) return code;
  if(s.includes('$')) return ['USD','CAD','AUD','NZD','SGD','HKD','MXN'].includes(S.currency) ? S.currency : 'USD';
  return '';
}

// ---------- Budget maths ----------
function periodAt(t){
  const pd = S.payday||1;
  let y=t.getFullYear(), m=t.getMonth();
  let start = new Date(y,m,Math.min(pd,dim(y,m)));
  if(start > t){ m--; if(m<0){m=11;y--;} start = new Date(y,m,Math.min(pd,dim(y,m))); }
  let ny=y, nm=m+1; if(nm>11){nm=0;ny++;}
  const next = new Date(ny,nm,Math.min(pd,dim(ny,nm)));
  const end = new Date(next.getFullYear(),next.getMonth(),next.getDate()-1);
  const daysLeft = Math.round((end - today0())/864e5)+1;
  return {start, end, next, daysLeft, s:ymd(start), e:ymd(end), len:Math.round((end-start)/864e5)+1};
}
const period = () => periodAt(today0());
function dueIn(bill, p){
  let y=p.start.getFullYear(), m=p.start.getMonth();
  let d=new Date(y,m,Math.min(bill.due||1,dim(y,m)));
  if(d<p.start){ m++; if(m>11){m=0;y++;} d=new Date(y,m,Math.min(bill.due||1,dim(y,m))); }
  // A short pay period (e.g. payday on the 31st in February) can end before the bill's day comes round.
  // Every bill still belongs to every period, so it counts on the period's last day.
  if(d>p.end) d=new Date(p.end);
  return d;
}
const billTx = (bill,p) => S.tx.find(t=>t.billId===bill.id && t.date>=p.s && t.date<=p.e);
function billsCatId(){
  let c=S.categories.find(x=>x.sys==='bills');
  if(!c){ c={id:uid(),name:'Bills',icon:'receipt',color:PALETTE[6],sys:'bills'}; S.categories.push(c); }
  return c.id;
}
function payBill(bill, dateStr, auto){
  S.tx.push({id:uid(),type:'spend',amount:bill.amount,cat:billsCatId(),date:dateStr,note:bill.name,billId:bill.id,auto:!!auto,ts:parseYmd(dateStr).getTime()+43200000});
}
// Auto bills log themselves on their due day.
function ensureAuto(p, uptoStr){
  let changed=false;
  for(const b of S.fixed){
    if(!b.auto || !(b.amount>0)) continue;
    const d=ymd(dueIn(b,p));
    if(d<=uptoStr && d>=p.s && d<=p.e && !billTx(b,p)){ payBill(b,d,true); changed=true; }
  }
  return changed;
}
// ---------- Vaults ----------
// A vault's balance is the sum of its movements: opening balance, monthly plan, leftovers, deposits and withdrawals.
// Deposits and withdrawals marked "budget" come out of (or go back into) this pay period's spending money.
const r2 = n => Math.round((+n||0)*100)/100;
const vname = v => (v && v.name) || 'Savings';
const vaultById = id => S.vaults.find(v=>v.id===id);
function vBal(id, upto){ let b=0; for(const m of S.vmoves){ if(m.vault===id && (!upto || m.date<=upto)) b += m.type==='out' ? -m.amount : m.amount; } return r2(b); }
const vTotal = upto => r2(S.vaults.reduce((a,v)=>a+vBal(v.id,upto),0));
const planTotal = () => r2(S.vaults.reduce((a,v)=>a+(+v.monthly||0),0));
function addMove(vault, type, amount, date, note, budget){
  const m = {id:uid(), vault, type, amount:r2(amount), date, note:note||'', ts:Date.now()};
  if(budget && (type==='in'||type==='out')) m.budget = true;
  S.vmoves.push(m); return m;
}
function setOpening(v, amount){
  S.vmoves = S.vmoves.filter(m=>!(m.vault===v.id && m.type==='open'));
  if(amount>0) addMove(v.id, 'open', amount, ymd(today0()), '');
}
const openingOf = v => r2(S.vmoves.filter(m=>m.vault===v.id && m.type==='open').reduce((a,m)=>a+m.amount,0));
function vaultLine(v, extra){
  const bal = vBal(v.id) + (extra||0);
  if(!v.target) return v.monthly ? fmt(v.monthly)+' set aside each month' : 'Add money whenever you like';
  const left = Math.max(0, v.target - bal);
  if(left===0) return 'Goal reached. Nice work.';
  if(!v.monthly) return fmt(left)+' to go';
  const months = Math.ceil(left/v.monthly);
  const d=new Date(); d.setMonth(d.getMonth()+months);
  return fmt(left)+' to go · there around '+d.toLocaleDateString(undefined,{month:'short',year:'numeric'});
}

function stats(p){
  const sav = planTotal();
  const budget = (+S.income||0) - sav;
  let spent=0, received=0, billsPaid=0;
  for(const t of S.tx){ if(t.date>=p.s && t.date<=p.e){ if(t.type==='in') received+=t.amount; else { spent+=t.amount; if(t.billId) billsPaid+=t.amount; } } }
  const fixedTotal = S.fixed.reduce((a,b)=>a+(+b.amount||0),0);
  let billsDue=0; const bills=[];
  for(const b of S.fixed){ if(!(b.amount>0)) continue; const tx=billTx(b,p); const due=dueIn(b,p); bills.push({b,tx,due}); if(!tx) billsDue+=b.amount; }
  bills.sort((a,b)=>a.due-b.due);
  let toVault=0, fromVault=0;
  for(const m of S.vmoves){ if(m.budget && m.date>=p.s && m.date<=p.e){ if(m.type==='in') toVault+=m.amount; else if(m.type==='out') fromVault+=m.amount; } }
  const net = spent - received;
  // Free to spend = income − saving plan − spent − bills still due − money moved into vaults + money taken out to spend.
  const free = r2(budget - net - billsDue - toVault + fromVault);
  return {p, sav, budget, spent, received, net, billsPaid, billsDue, fixedTotal, toVault:r2(toVault), fromVault:r2(fromVault), free, bills, perDay: p.daysLeft>0 ? free/p.daysLeft : free};
}
const totals = () => stats(period());

// Period rollover: wrap up the period that just ended.
function checkRollover(){
  if(!S.setup || S.sample) return;
  const cur = period();
  if(!S.lastPeriod){ S.lastPeriod=cur.s; save(); return; }
  if(S.lastPeriod===cur.s) return;
  if(S.lastPeriod > cur.s){ S.lastPeriod=cur.s; save(); return; }
  // Close every pay period that ended since Eight was last opened (up to two years).
  // Vaults never change by themselves: the money not spent (saving plan + leftover) is either
  // offered to the user, or moved automatically if they chose that.
  let pp = periodAt(parseYmd(S.lastPeriod)), first=null, last=null, guard=24, leftover=0, planned=0, total=0;
  while(pp.s < cur.s && guard--){
    ensureAuto(pp, pp.e);
    const st = stats(pp), amt = r2(Math.max(0, st.free + st.sav));
    const label = shortDate(pp.start)+' – '+shortDate(pp.end);
    if(S.monthEnd==='auto' && amt>0) addMove(S.autoVault, 'left', amt, pp.e, 'Month end · '+label);
    first = first || pp; last = pp; leftover += st.free; planned += st.sav; total += amt;
    pp = periodAt(pp.next);
  }
  if(last) S.wrap = {label: shortDate(first.start)+' – '+shortDate(last.end), leftover:r2(leftover), planned:r2(planned), total:r2(total), auto: S.monthEnd==='auto'};
  S.lastPeriod = cur.s; save();
}

function shortDate(d){ return d.toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
function dayLabel(s){
  const t=today0(), d=parseYmd(s), diff=Math.round((t-d)/864e5);
  if(diff===0) return 'Today'; if(diff===1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
}

// Shrink big numbers so they always fit on one line inside their box.
function fitText(scope){
  (scope||document).querySelectorAll('[data-fit]').forEach(el=>{
    el.style.fontSize='';
    const room = el.parentElement ? el.parentElement.clientWidth - (parseFloat(getComputedStyle(el.parentElement).paddingLeft)||0) - (parseFloat(getComputedStyle(el.parentElement).paddingRight)||0) : el.clientWidth;
    let fs = parseFloat(getComputedStyle(el).fontSize), guard = 40;
    while(el.scrollWidth > room + 1 && fs > 18 && guard--){ fs = Math.max(18, fs*0.94); el.style.fontSize = fs+'px'; }
  });
}

        S.merchantCats = S.merchantCats||{}; S.merchantCats[opts.merchant.toLowerCase()] = catId;
      }
      else { S.tx.push({id:uid(),amount:v,type,cat:catId,date,note,ts:Date.now(),...(orig?{orig}:{})}); S.lastCat=catId; }
      save(); closeSheet(); render();
      const T=totals();
      toast(existing ? 'Saved' : 'Added '+fmt(v)+(orig?' ('+fmtCur(raw,cur)+')':'')+' · '+(T.free<0?'over by '+fmt(-T.free,{noSign:true}):fmt(T.free)+' free to spend'));
    };
    if(existing) $('#xDel').onclick=()=>confirmSheet('Delete this entry?', fmt(existing.amount)+' · '+(existing.note||cat(existing.cat).name)+(existing.billId?'. The bill will show as unpaid again.':''), 'Delete', ()=>{ S.tx=S.tx.filter(t=>t.id!==existing.id); save(); render(); toast('Deleted'); });
    keyHandler = e=>{
      if(document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
      if(/^[0-9]$/.test(e.key)) press(e.key);
      else if(e.key==='.'||e.key===',') press('.');
      else if(e.key==='Backspace') press('del');
      else if(e.key==='Enter') $('#xSave').click();
      else if(e.key==='Escape') closeSheet();
    };
    document.addEventListener('keydown', keyHandler);
    paint();
  }, existing?'Edit entry':'Add spending');
}

function bigMoney(n){

  return m ? (m[1].trim()?`<small>${esc(m[1].trim())}</small>`:'')+esc(m[2])+(m[3].trim()?`<small class="suf">${esc(m[3].trim())}</small>`:'') : esc(t);
}
const wholeNum = n => (n<0?'−':'')+Math.round(Math.abs(+n||0)).toLocaleString('en-US');
function vsLast(){
  const p=period(), prev=prevPeriod(p);
  const d=new Date(prev.start); d.setDate(d.getDate()+Math.round((today0()-p.start)/864e5));
  const upto=ymd(d>prev.end?prev.end:d);
  const a=spendIn(p).total, b=spendIn(prev, upto).total;

// ---------- Monthly comparison ----------
let actSel = null; // which pay period Activity shows (index into the chart); null = the current one
function periodsBack(n){
  const out=[]; let p=period();
  for(let i=0;i<n;i++){ out.unshift(p); p=periodAt(new Date(p.start.getFullYear(),p.start.getMonth(),p.start.getDate()-1)); }
  return out;
}
const prevPeriod = p => periodAt(new Date(p.start.getFullYear(),p.start.getMonth(),p.start.getDate()-1));
function periodLabel(p){ const mid=new Date(p.start.getTime()+(p.end-p.start)/2); return mid.toLocaleDateString(undefined,{month:'short'}); }
function compact(n){
  n=Math.round(+n||0);
  if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e4) return Math.round(n/1e3)+'k';
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'k';
  return String(n);
}
function spendIn(p, upto){
  const by={}; let bills=0, other=0;
  for(const t of S.tx){
    if(t.type!=='spend' || t.date<p.s || t.date>p.e || (upto && t.date>upto)) continue;
    by[t.cat]=(by[t.cat]||0)+t.amount; if(t.billId) bills+=t.amount; else other+=t.amount;
  }
  return {by, bills:r2(bills), other:r2(other), total:r2(bills+other)};
}
function chartHtml(cols, sel, attr){
  const max = Math.max(1, ...cols.map(c=>c.a+(c.b||0)));
  return `<div class="chart">${cols.map((c,i)=>{
    const t=c.a+(c.b||0), h=t>0?Math.max(3,t/max*82):2;
    const inner = `<span class="plot"><span class="v num">${compact(t)}</span><span class="bars" style="height:${h}%">${c.a>0?`<i class="a" style="height:${c.a/t*100}%"></i>`:''}${c.b>0?`<i class="b" style="height:${c.b/t*100}%"></i>`:''}</span></span><span class="m">${esc(c.label)}</span>`;
    const cls = 'col'+(c.now?' now':'')+(i===sel?' sel':' dim');
    return attr ? `<button class="${cls}" ${attr}="${i}" aria-pressed="${i===sel}" aria-label="${esc(c.title)}">${inner}</button>` : `<div class="${cls}" role="img" aria-label="${esc(c.title)}">${inner}</div>`;
  }).join('')}</div>`;
}
function deltaHtml(diff, prev){
  if(Math.abs(diff)<0.005) return '<span class="delta flat">same</span>';
  if(!(prev>0)) return '<span class="delta up">new</span>';
  return `<span class="delta ${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${esc(fmt(Math.abs(diff)))}</span>`;
}

function activityView(){
  let earliest = null; for(const t of S.tx){ if(!earliest || t.date<earliest) earliest=t.date; }
  const all = periodsBack(6);
  const periods = all.filter((p,i)=>i===all.length-1 || (earliest && p.e>=earliest));
  const last = periods.length-1;
  const sel = actSel==null || actSel>last ? last : actSel;
  const p = periods[sel], prev = prevPeriod(p), isNow = sel===last;
  let upto = null;
  if(isNow){ const d=new Date(prev.start); d.setDate(d.getDate()+Math.round((today0()-p.start)/864e5)); upto = ymd(d>prev.end?prev.end:d); }
  const cur = spendIn(p), pv = spendIn(prev, upto);
  const cols = periods.map((q,i)=>{ const x = i===sel ? cur : spendIn(q); return {a:x.other, b:x.bills, label:periodLabel(q), now:i===last, title:periodLabel(q)+': '+fmt(x.total)+(i===last?' so far':'')}; });
  const done = periods.slice(0,last).map(q=>spendIn(q).total).filter(v=>v>0);
  const avg = done.length ? done.reduce((a,b)=>a+b,0)/done.length : 0;
  const diff = cur.total - pv.total;
  const cmpLine = pv.total>0
    ? `<span class="delta ${Math.abs(diff)<0.005?'flat':diff>0?'up':'down'}">${Math.abs(diff)<0.005?'Same':(diff>0?'▲ ':'▼ ')+esc(fmt(Math.abs(diff)))+' '+(diff>0?'more':'less')}</span> <span class="muted">${isNow?'than by this day last month':'than the month before'}</span>`
    : `<span class="muted">${isNow?'Nothing to compare with yet':'No spending logged the month before'}</span>`;
  const ids = [...new Set([...Object.keys(cur.by), ...Object.keys(pv.by)])].sort((a,b)=>(cur.by[b]||0)-(cur.by[a]||0) || (pv.by[b]||0)-(pv.by[a]||0));
  const max = Math.max(1, ...ids.map(id=>Math.max(cur.by[id]||0, pv.by[id]||0)));
  const rows = ids.map(id=>{ const c=cat(id), a=r2(cur.by[id]||0), b=r2(pv.by[id]||0);
    return `<div class="cmp-row num">${icoBox(c.icon,c.color)}<span>${esc(c.name)}</span><span class="amt">${fmt(a)}${deltaHtml(a-b,b)}</span><span class="track"><i style="width:${a/max*100}%;background:${c.color}"></i>${b>0?`<u style="left:calc(${b/max*100}% - 1px)"></u>`:''}</span></div>`; }).join('');
  const groups = {};
  sorted().filter(t=>t.date>=p.s && t.date<=p.e).slice(0,400).forEach(t=>{ (groups[t.date]=groups[t.date]||[]).push(t); });
  const range = esc(shortDate(p.start))+' – '+esc(shortDate(p.end));
  return `
  <h1 class="page-title">Activity</h1>
  <div class="section" style="margin-top:14px">
    <div class="section-head"><h2><span class="hi">${ic('bars')}</span>Monthly spending</h2>${avg>0?`<span class="muted num" style="font-size:13px;font-weight:600">Average ${esc(fmt(avg))}</span>`:''}</div>
    <div class="panel stack">
      ${chartHtml(cols, sel, 'data-per')}
      <div class="chart-legend"><span><b style="background:var(--brand)"></b>Everyday spending</span><span><b style="background:color-mix(in srgb, var(--brand) 42%, var(--bg))"></b>Bills</span>${periods.length>1?'<span>Tap a month to compare</span>':''}</div>
      ${periods.length<2?'<p class="muted" style="margin:0;font-size:13.5px">After your next payday you’ll see each month side by side here.</p>':''}
    </div>
  </div>
  <div class="section">
    <div class="cmp-head"><span class="label">${isNow?'This month so far':esc(periodLabel(p))} · ${range}</span><span class="tot num">${fmt(cur.total)}</span></div>
    <div class="num" style="font-size:14px;margin-top:-4px">${cmpLine}</div>
    <div class="panel">${rows || '<p class="muted" style="margin:0">Your spending by category will show here.</p>'}
      ${rows&&pv.total>0?`<p class="muted" style="margin:8px 0 0;font-size:12.5px">The small line on each bar marks ${isNow?'where you were by this day last month':'the month before'}.</p>`:''}</div>
  </div>
  ${Object.keys(groups).length ? Object.entries(groups).map(([d,list])=>`<div class="daygroup"><div class="label">${esc(dayLabel(d))}</div><div class="list">${list.map(txRow).join('')}</div></div>`).join('') : '<div class="empty" style="margin-top:20px">No entries in this month.</div>'}`;
}

const VAULT_ICONS = ['coins','shield','plane','home','receipt','gift','car','book','heart','baby','sparkle','vault'];
const MOVE_LABEL = {open:'Starting balance', plan:'Monthly plan', left:'Leftover', in:'Added', out:'Taken out'};
function moveRow(m){
  const v = vaultById(m.vault), neg = m.type==='out';
  const extra = m.budget ? (neg?' · for spending':' · from spending money') : '';
  const icon = neg?'arrowOut':m.type==='plan'?'calendar':m.type==='left'?'sparkle':m.type==='open'?'vault':'arrowIn';
  return `<button class="tx" data-move="${m.id}">${icoBox(icon, neg?'#e5484d':'#12a594')}
    <span class="meta"><span class="t1">${esc(m.note||MOVE_LABEL[m.type])}</span><span class="t2">${esc((S.vaults.length>1?vname(v)+' · ':'')+dayLabel(m.date)+extra)}</span></span>
    <span class="amt num ${neg?'':'in'}">${neg?'−':'+'}${fmt(m.amount)}</span></button>`;
}
const movesSorted = list => [...list].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts-a.ts));
function vaultCard(v){
  const bal=vBal(v.id), pct = v.target ? Math.min(100, Math.max(0,bal)/v.target*100) : 0;
  return `<button class="vcard" data-vault="${v.id}">
    <span class="r1"><span class="ico">${ic(v.icon)}</span><span class="nm"><b>${esc(vname(v))}</b><small class="num">${v.target?'Goal '+esc(fmt(v.target)):v.monthly?esc(fmt(v.monthly))+' a month':'No monthly amount'}</small></span><span class="bal num">${fmt(bal)}</span></span>
    ${v.target?`<span class="prog"><i style="width:${pct}%"></i></span>`:''}
    <span class="ln num">${esc(vaultLine(v))}</span></button>`;
}
function vaultView(){
  const total=vTotal(), plan=planTotal();
  let growth = '';
  if(S.vmoves.length){
    let first=null; for(const m of S.vmoves){ if(!first || m.date<first) first=m.date; }
    const all = periodsBack(6);
    const ps = all.filter((p,i)=>i===all.length-1 || p.e>=first);
    const vals = ps.map((p,i)=> i===ps.length-1 ? total : vTotal(p.e));
    const up = vals[vals.length-1]-vals[0];
    growth = `<div class="section">
      <div class="section-head"><h2><span class="hi">${ic('trend')}</span>Growth</h2>${ps.length>1&&up>0?`<span class="delta down num">▲ ${esc(fmt(up))} since ${esc(periodLabel(ps[0]))}</span>`:''}</div>
      <div class="panel">${chartHtml(ps.map((p,i)=>({a:Math.max(0,vals[i]), b:0, label:periodLabel(p), now:i===ps.length-1, title:periodLabel(p)+': '+fmt(vals[i])})), ps.length-1, null)}</div>
    </div>`;
  }
  const moves = movesSorted(S.vmoves).slice(0,30);
  return `
  <section class="hero" aria-label="In your vaults">
    ${coinDeco('deco')}
    <div class="h-label">In your ${S.vaults.length>1?'vaults':'vault'}</div>
    <div class="big num" data-fit>${fmt(total)}</div>
    <div class="sub num">${plan>0?esc(fmt(plan))+' set aside each month, already taken off your budget':'Add money whenever you like'}</div>
    <div class="hero-btns"><button class="solid" id="vIn">${ic('arrowIn')} Add money</button><button id="vOut" ${total>0?'':'disabled'}>${ic('arrowOut')} Take out</button></div>
  </section>
  <div class="section">
    <div class="section-head"><h2><span class="hi">${ic('vault')}</span>Your vaults</h2><button class="link" id="vNew">New vault</button></div>
    <div class="vlist">${S.vaults.map(vaultCard).join('')}</div>
  </div>
  ${growth}
  <div class="section">
    <h2><span class="hi">${ic('list')}</span>History</h2>
    ${moves.length?'<div class="list">'+moves.map(moveRow).join('')+'</div>':'<div class="empty">Nothing in your vault yet.<br>Add money you’ve already saved, or set a monthly amount.</div>'}
  </div>`;
}
function bindMoves(scope){
  scope.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
    const m=S.vmoves.find(x=>x.id===b.dataset.move); if(!m) return;
    confirmSheet('Delete this entry?', (m.note||MOVE_LABEL[m.type])+', '+fmt(m.amount)+', '+dayLabel(m.date)+'. The vault balance changes to match.', 'Delete entry', ()=>{
      S.vmoves=S.vmoves.filter(x=>x.id!==m.id); save(); render(); toast('Entry deleted', {label:'Undo', run:()=>{ S.vmoves.push(m); save(); render(); }});
    });
  });
}
function bindVault(){
  const q=s=>root.querySelector(s);
  q('#vIn').onclick=()=>moveSheet('in');
  q('#vOut').onclick=()=>moveSheet('out');
  q('#vNew').onclick=()=>vaultSheet(newVault(''), true);
  root.querySelectorAll('[data-vault]').forEach(b=>b.onclick=()=>{ const v=vaultById(b.dataset.vault); v&&vaultSheet(v,false); });
  bindMoves(root);
}

function moveSheet(type, vaultId){
  const isIn = type==='in';
  let vid = vaultId || (isIn ? S.vaults[0].id : (S.vaults.find(v=>vBal(v.id)>0)||S.vaults[0]).id);
  const title = isIn ? 'Add to '+(S.vaults.length>1?'a vault':'your vault') : 'Take out of '+(S.vaults.length>1?'a vault':'your vault');
  openSheet(`<div class="stack">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="btn ghost sm" id="mvX">Cancel</button></div>
    ${S.vaults.length>1?`<div class="chips" id="mvV">${S.vaults.map(v=>`<button class="chip" data-v="${v.id}" aria-pressed="${v.id===vid}">${ic(v.icon)}${esc(vname(v))}</button>`).join('')}</div>`:''}
    <label class="field"><span>Amount</span><div class="money"><em>${esc(S.currency)}</em><input class="input num" id="mvAmt" inputmode="decimal" placeholder="0" autocomplete="off"></div></label>
    <p class="muted num" id="mvBal" style="margin:-6px 0 0;font-size:13px"></p>
    <label class="switch"><input type="checkbox" id="mvBud" checked><span class="knob"></span><span>${isIn?'From this month’s spending money':'Use it for spending this month'}<small id="mvBudS"></small></span></label>
    <label class="field"><span>Note (optional)</span><input class="input" id="mvNote" maxlength="60" placeholder="${isIn?'e.g. Bonus':'e.g. New laptop'}"></label>
    <button class="btn primary" id="mvOk" disabled>${isIn?'Add money':'Take out'}</button>
  </div>`, sh=>{
    const q=s=>sh.querySelector(s);
    const paint=()=>{
      const v=vaultById(vid), bal=vBal(vid), amt=num(q('#mvAmt').value), bud=q('#mvBud').checked;
      const over = !isIn && amt>bal+0.004;
      q('#mvBal').textContent = over ? 'That’s more than the '+fmt(bal)+' in '+vname(v)+'.' : 'In '+vname(v)+': '+fmt(bal);
      q('#mvBal').style.color = over ? 'var(--bad)' : '';
      q('#mvBudS').textContent = isIn ? (bud?'Lowers what’s free to spend until payday':'Money you already had, so your budget stays the same')
                                      : (bud?'Adds it to what’s free to spend until payday':'Your budget stays the same, e.g. you moved it to another account');
      q('#mvOk').disabled = !(amt>0) || over;
    };
    sh.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ vid=b.dataset.v; sh.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b)); paint(); });
    q('#mvAmt').oninput=paint; q('#mvBud').onchange=paint;
    q('#mvX').onclick=closeSheet;
    q('#mvOk').onclick=()=>{
      const amt=num(q('#mvAmt').value); if(!(amt>0)) return;
      if(!isIn && amt>vBal(vid)+0.004) return;
      const m = addMove(vid, type, amt, ymd(today0()), q('#mvNote').value.trim().slice(0,60), q('#mvBud').checked);
      save(); closeSheet(); render();
      toast(fmt(amt)+(isIn?' added to ':' taken out of ')+vname(vaultById(vid)), {label:'Undo', run:()=>{ S.vmoves=S.vmoves.filter(x=>x.id!==m.id); save(); render(); }});
    };
    paint(); setTimeout(()=>q('#mvAmt').focus(), 50);
  }, title);
}

function vaultSheet(v, isNew){
  const cur = esc(S.currency);
  const hist = isNew ? [] : movesSorted(S.vmoves.filter(m=>m.vault===v.id)).slice(0,12);
  openSheet(`<div class="stack">
    <div class="sheet-head"><h2>${isNew?'New vault':esc(vname(v))}</h2><button class="btn ghost sm" id="vsDone">${isNew?'Cancel':'Done'}</button></div>
    ${isNew?'':`<div><span class="label">Balance</span><div class="big-bal num" data-fit>${fmt(vBal(v.id))}</div></div>
      <div class="btnrow"><button class="btn soft sm" id="vsIn">${ic('arrowIn')} Add money</button><button class="btn soft sm" id="vsOut" ${vBal(v.id)>0?'':'disabled'}>${ic('arrowOut')} Take out</button></div>`}
    <label class="field"><span>Name</span><input class="input" id="vsName" maxlength="40" value="${esc(v.name)}" placeholder="e.g. Japan trip"></label>
    <div class="icon-grid" id="vsIco">${VAULT_ICONS.map(k=>`<button data-ik="${k}" aria-pressed="${v.icon===k}" aria-label="${k}">${ic(k)}</button>`).join('')}</div>
    <div class="row2">
      <label class="field"><span>Goal (optional)</span><div class="money"><em>${cur}</em><input class="input num" id="vsTarget" inputmode="decimal" value="${v.target||''}" placeholder="0"></div></label>
      <label class="field"><span>Add each month</span><div class="money"><em>${cur}</em><input class="input num" id="vsMonthly" inputmode="decimal" value="${v.monthly||''}" placeholder="0"></div></label>
    </div>
    ${isNew?`<label class="field"><span>Already saved (optional)</span><div class="money"><em>${cur}</em><input class="input num" id="vsOpen" inputmode="decimal" placeholder="0"></div></label>`:''}
    <p class="muted num" id="vsLine" style="margin:0;font-size:14px"></p>
    <p class="muted" style="margin:0;font-size:13px">The monthly amount comes off your budget first, so what’s free to spend each day already allows for it. At the end of each month, Eight offers to move it, plus anything you didn’t spend, into your vault.</p>
    ${isNew?'<button class="btn primary" id="vsCreate">Create vault</button>':''}
    ${hist.length?`<span class="label" style="margin-top:6px">History</span><div class="list">${hist.map(moveRow).join('')}</div>`:''}
    ${!isNew && S.vaults.length>1?'<button class="btn danger sm" id="vsDel" style="align-self:flex-start">Delete this vault</button>':''}
  </div>`, sh=>{
    const q=s=>sh.querySelector(s);
    const keep = () => { if(!isNew) save(); };
    const line = () => { const extra = isNew ? num(q('#vsOpen').value) : 0; q('#vsLine').textContent = vaultLine(v, extra); };
    q('#vsName').oninput=e=>{ v.name=e.target.value.slice(0,40); keep(); };
    sh.querySelectorAll('[data-ik]').forEach(b=>b.onclick=()=>{ v.icon=b.dataset.ik; keep(); sh.querySelectorAll('[data-ik]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
    q('#vsTarget').oninput=e=>{ v.target=num(e.target.value); keep(); line(); };
    q('#vsMonthly').oninput=e=>{ v.monthly=num(e.target.value); keep(); line(); };
    if(isNew){
      q('#vsOpen').oninput=line;
      q('#vsCreate').onclick=()=>{
        if(!v.name.trim()) v.name = 'Vault '+(S.vaults.length+1);
        S.vaults.push(v); setOpening(v, num(q('#vsOpen').value)); save(); closeSheet(); render(); toast(vname(v)+' created');
      };
      q('#vsDone').onclick=closeSheet;
      setTimeout(()=>q('#vsName').focus(), 50);
    } else {
      q('#vsDone').onclick=()=>{ if(!v.name.trim()){ v.name='Savings'; save(); } closeSheet(); render(); };
      q('#vsIn').onclick=()=>moveSheet('in', v.id);
      q('#vsOut').onclick=()=>moveSheet('out', v.id);
      bindMoves(sh);
      const del=q('#vsDel'); if(del) del.onclick=()=>{
        const bal=vBal(v.id);
        confirmSheet('Delete '+vname(v)+'?', (bal>0?'Its '+fmt(bal)+' and history will be removed from Eight. ':'')+'This can’t be undone.', 'Delete vault', ()=>{
          S.vaults=S.vaults.filter(x=>x.id!==v.id); S.vmoves=S.vmoves.filter(m=>m.vault!==v.id); if(S.autoVault===v.id) S.autoVault=S.vaults[0].id; save(); render(); toast(vname(v)+' deleted');
        });
      };
    }
    line(); fitText(sh);
  }, isNew?'New vault':vname(v));
  document.querySelector('.scrim').addEventListener('click',e=>{ if(e.target.classList.contains('scrim')) render(); });
}

function dueOptions(sel){ return Array.from({length:31},(_,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>Due ${ordinal(i+1)}</option>`).join(''); }
function billEditor(b){
  return `<div class="bill-card" data-bill="${b.id}">
    <div class="r1"><span class="ico" style="background:var(--brand-soft);color:var(--brand-text)" data-bico>${ic(billIcon(b.name))}</span><input class="input" data-f="name" value="${esc(b.name)}" placeholder="Bill name" aria-label="Bill name"><button class="icon-btn" data-rm="${b.id}" aria-label="Remove ${esc(b.name||'bill')}">×</button></div>
    <div class="r2"><div class="money"><em>${esc(S.currency)}</em><input class="input num" data-f="amount" inputmode="decimal" value="${b.amount||''}" placeholder="0" aria-label="Amount"></div><select class="input" data-f="due" aria-label="Due day">${dueOptions(b.due)}</select></div>
    <label class="switch"><input type="checkbox" data-f="auto" ${b.auto?'checked':''}><span class="knob"></span><span>Add to spent automatically<small>On the due day, Eight logs it for you</small></span></label>
  </div>`;
}
function bindBillEditors(scope, onChange){
  scope.querySelectorAll('[data-bill]').forEach(r=>{
    const b=S.fixed.find(x=>x.id===r.dataset.bill); if(!b) return;
    r.querySelector('[data-f="name"]').oninput=e=>{ b.name=e.target.value; r.querySelector('[data-bico]').innerHTML=ic(billIcon(b.name)); save(); };
    r.querySelector('[data-f="amount"]').oninput=e=>{ b.amount=num(e.target.value); save(); onChange&&onChange(false); };
    r.querySelector('[data-f="amount"]').onchange=()=>onChange&&onChange(true);
    r.querySelector('[data-f="due"]').onchange=e=>{ b.due=+e.target.value; save(); onChange&&onChange(true); };
    r.querySelector('[data-f="auto"]').onchange=e=>{ b.auto=e.target.checked; save(); toast(b.auto?(b.name||'Bill')+' will add itself on the '+ordinal(b.due):'You’ll mark '+(b.name||'this bill')+' as paid yourself'); onChange&&onChange(true); };
  });
  scope.querySelectorAll('[data-rm]').forEach(btn=>btn.onclick=()=>{ S.fixed=S.fixed.filter(x=>x.id!==btn.dataset.rm); save(); render(); });
}

function changeHomeCurrency(to){
  const from = S.currency;
  if(to===from) return;
  const hasNumbers = S.tx.length || S.income || S.fixed.length || S.vmoves.length || S.vaults.some(v=>v.target||v.monthly);
  const k = rate(from, to);
  const relabel = ()=>{ S.currency=to; save(); render(); toast('Currency set to '+to); };
  if(!hasNumbers || !k){ relabel(); return; }
  const r = n => Math.round((+n||0)*k*100)/100;
  openSheet(`<div class="stack" style="padding:8px 0"><h2>Switch to ${esc(to)}?</h2>
    <p class="muted" style="margin:0">Convert your income, bills, savings and entries from ${esc(from)} to ${esc(to)} at 1 ${esc(from)} = ${fmtPlain(+k.toPrecision(4))} ${esc(to)}? Or keep the numbers and only change the currency label.</p>
    <button class="btn primary" id="hcConv">Convert my amounts</button>
    <button class="btn soft" id="hcLabel">Only change the label</button>
    <button class="btn ghost" id="hcNo">Cancel</button></div>`, sh=>{
    sh.querySelector('#hcConv').onclick=()=>{
      S.income=r(S.income);
      S.fixed.forEach(b=>{ b.amount=r(b.amount); });
      S.vaults.forEach(v=>{ v.target=r(v.target); v.monthly=r(v.monthly); });
      S.vmoves.forEach(m=>{ m.amount=r(m.amount); });
      if(S.wrap){ S.wrap.leftover=r(S.wrap.leftover); S.wrap.planned=r(S.wrap.planned); S.wrap.total=r(S.wrap.total); }
      S.tx.forEach(t=>{
        t.amount=r(t.amount);
        if(t.orig){ if(t.orig.cur===to){ t.amount=t.orig.amount; delete t.orig; } else t.orig.rate=t.orig.rate*k; }
        else t.orig={amount:Math.round(t.amount/k*100)/100, cur:from, rate:k};
      });
      S.currency=to; rememberCur(from); save(); closeSheet(); render(); toast('Converted to '+to);
    };
    sh.querySelector('#hcLabel').onclick=()=>{ closeSheet(); relabel(); };
    sh.querySelector('#hcNo').onclick=()=>{ closeSheet(); render(); };
  }, 'Change currency');
}

function bindOb(){
  const q=s=>root.querySelector(s);
  const go=n=>{ S.obStep=n; save(); render(); window.scrollTo(0,0); };
  q('#obBack') && (q('#obBack').onclick=()=>go(S.obStep===3 && !V0().target ? 1 : S.obStep-1));

  const st=S.obStep;
  if(st===0){ next.onclick=()=>go(1); q('#obSample').onclick=()=>{ loadSample(); tab='home'; render(); }; return; }
  if(st===1){
    root.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{ const g=GOALS.find(x=>x.k===b.dataset.goal); V0().name=g.k; V0().icon=g.i; save(); go(1); });
    next.onclick=()=>go(2);
    q('#obSkip').onclick=()=>{ Object.assign(V0(), {name:'Savings', icon:'coins', target:0, months:12, monthly:0}); setOpening(V0(), 0); go(3); };
    return;
  }
  let paintSaveLine=null;
  const curSel=q('#obCur');
  if(curSel) curSel.onclick=()=>pickCurrency(S.currency, c=>{ S.currency=c; save(); curSel.querySelector('span').innerHTML=curBtnLabel(c); root.querySelectorAll('.curTag').forEach(t=>t.textContent=S.currency); paintSaveLine&&paintSaveLine(); });
  if(st===2){
    // What's already saved counts towards the target, so the monthly amount only covers the rest.
    paintSaveLine=()=>{ const v=V0(), left=Math.max(0, v.target-openingOf(v)); v.monthly = v.target ? Math.ceil(left/v.months) : 0;
      q('#obSaveLine').textContent = !v.target ? 'Enter a target to see your monthly amount.' : left===0 ? 'You’ve already saved enough. Nice work.' : 'That’s '+fmt(v.monthly)+' a month, set aside before you spend.'; save(); };
    q('#obTarget').oninput=e=>{V0().target=num(e.target.value);paintSaveLine();};
    q('#obHave').oninput=e=>{setOpening(V0(), num(e.target.value));paintSaveLine();};
    q('#obMonths').onchange=e=>{V0().months=+e.target.value;paintSaveLine();};
    paintSaveLine();
    next.onclick=()=>go(3);
    return;
  }
  if(st===3){
    q('#obIncome').oninput=e=>{S.income=num(e.target.value);save();next.disabled=!S.income;};
    q('#obPayday').onchange=e=>{S.payday=+e.target.value;save();};
    next.onclick=()=>go(4); return;
  }
  if(st===4){
    const tot=()=>{q('#obBillTotal').textContent=fmt(S.fixed.reduce((a,b)=>a+(+b.amount||0),0));};
    root.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ const id=uid(); S.fixed.push({id,name:b.dataset.preset||'',amount:0,due:S.payday||1,auto:false}); save(); render();

    bindBillEditors(q('#obBills'), ()=>tot());
    next.onclick=()=>{ S.fixed=S.fixed.filter(b=>b.amount>0||b.name.trim()); S.fixed.forEach(b=>{if(!b.name.trim())b.name='Bill';}); go(5); };
    return;
  }
  next.onclick=()=>{ if(!V0().name) V0().name='Savings'; S.setup=true; S.obStep=0; S.lastPeriod=period().s; save(); tab='home'; render(); window.scrollTo(0,0); };
}

// ---------- Apple Pay auto-logging ----------
// The Shortcuts "Wallet" (formerly "Transaction") automation opens eight://log?t=<amount>|<merchant>.
// Amounts arrive formatted for the phone's region, e.g. "AED 1,234.50", "$5.99" or "1.234,50 €".
function parseAmount(str){
  let s = String(str||'')
    .replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x0660))
    .replace(/[\u06F0-\u06F9]/g, d=>String(d.charCodeAt(0)-0x06F0))
    .replace(/\u066B/g,'.').replace(/[\u066C\u00A0\u202F]/g,'')
    .replace(/[^0-9.,]/g,' ');
  // Take the number only, so dots in currency signs such as "د.إ." or "Dhs." are ignored.
  const m = s.match(/\d[\d.,]*\d|\d/);
  s = m ? m[0] : '';
  if(!s) return 0;
  const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
  if(lastDot>-1 && lastComma>-1){
    if(lastComma>lastDot) s = s.replace(/\./g,'').replace(',', '.');
    else s = s.replace(/,/g,'');
  } else if(lastComma>-1){
    s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g,'');
  } else if((s.match(/\./g)||[]).length>1){
    s = s.replace(/\./g,'');
  }
  return num(s);
}
const MERCHANT_HINTS = [
  [/coffee|caf[eé]|starbucks|costa|tim horton|dunkin|karak|bakery|restaurant|grill|pizza|burger|kfc|mcdonald|shawarma|talabat|deliveroo|careem food|noon food|zomato|\beats?\b/i, 'Food & drinks'],
  [/carrefour|lulu|spinneys|waitrose|choithrams|union coop|supermarket|grocery|hypermarket|market|kibsons|instashop|tesco|sainsbury|aldi|lidl|whole foods|trader joe/i, 'Groceries'],
  [/uber|careem|taxi|\brta\b|salik|\bnol\b|metro|enoc|adnoc|emarat|eppco|petrol|fuel|parking|lyft|\bbolt\b|\bshell\b/i, 'Transport'],
  [/amazon|noon|namshi|ikea|zara|h&m|centrepoint|shein|apple store|sharaf|virgin|mall/i, 'Shopping'],
  [/pharmacy|aster|boots|life pharmacy|clinic|hospital|medical|dental/i, 'Health'],
  [/cinema|vox|reel cinema|netflix|spotify|playstation|steam|xbox|ticket|museum/i, 'Fun']
];
function guessCategory(merchant){
  const m = String(merchant||'').trim();
  const learned = S.merchantCats && S.merchantCats[m.toLowerCase()];
  if(learned && S.categories.some(c=>c.id===learned)) return learned;
  for(const [re, name] of MERCHANT_HINTS){ if(re.test(m)){ const c=S.categories.find(x=>x.name===name); if(c) return c.id; } }
  const other = S.categories.find(c=>c.name==='Other');
  return (other||S.categories[0]).id;
}
function logPayment(raw){
  let text = String(raw||'');
  try{ text = decodeURIComponent(text); }catch(e){}
  try{ text = decodeURIComponent(text); }catch(e){} // tolerate double encoding
  const bar = text.indexOf('|');
  const amountPart = bar>-1 ? text.slice(0,bar) : text;
  const merchant = (bar>-1 ? text.slice(bar+1) : '').replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,60);
  const amount = Math.min(parseAmount(amountPart.slice(0,40)), 1e9);
  // A negative amount ("-AED 5", "(AED 5)") is a refund: log it as money received, not spending.
  const refund = /^[\s\D]*[-\u2212(]/.test(amountPart.slice(0,40)) || /^[^\d]*\d[\d.,\s]*-\s*$/.test(amountPart.slice(0,40));
  let cur = detectCurrency(amountPart) || S.currency;
  if(cur!==S.currency && !rate(cur, S.currency)) cur = S.currency;
  tab = 'home'; render();
  if(!S.setup){ toast('Set up your budget first, then payments will log themselves'); return; }
  if(!amount){
    const fix = {label:'How to fix', run:()=>{ tab='profile'; render(); const h=document.getElementById('payGuide'); if(h) h.scrollIntoView({block:'start'}); }};
    if(merchant){
      // The shop came through but not the amount: let the person type it, nothing is guessed.
      txSheet(null, '', {note:merchant, merchant, cat:guessCategory(merchant), cur});
      toast('Apple Pay sent the shop but no amount. Type it in, then check step 3 of the setup.', fix);
    } else {
      toast('Shortcuts sent Eight an empty payment. Running the automation by hand does this; a real Apple Pay payment fills it in.', fix);
    }
    return;
  }
  // Shortcuts can fire twice for one payment. Ignore an identical payment within a minute.
  const now = Date.now();
  const dupe = S.tx.find(t=>t.source==='applepay' && (t.orig?t.orig.amount:t.amount)===amount && (t.orig?t.orig.cur:S.currency)===cur && (t.merchant||'')===merchant && now-(t.ts||0) < 60000);
  if(dupe){ return; }
  const k = rate(cur, S.currency);
  const tx = {id:uid(), type: refund ? 'in' : 'spend', amount: cur===S.currency ? amount : toHome(amount,k), cat:guessCategory(merchant), date:ymd(today0()), note:merchant, merchant, source:'applepay', ts:now,
    ...(cur===S.currency ? {} : {orig:{amount, cur, rate:k}})};
  if(cur!==S.currency) rememberCur(cur);
  S.tx.push(tx); save(); render();
  toast((refund?'Logged refund ':'Logged ')+fmt(tx.amount)+(tx.orig?' ('+fmtCur(amount,cur)+')':'')+(merchant?' at '+merchant:'')+' · '+cat(tx.cat).name, {label:'Undo', run:()=>{ S.tx=S.tx.filter(t=>t.id!==tx.id); save(); render(); toast('Removed'); }});
}

function openFromLink(url){
  const u = String(url||'');
  const m = u.match(/^eight:\/\/shot\/([a-z]+)/);
  if(m){ shotView(m[1]); return; }
  const lg = u.match(/^eight:\/\/log\?t=(.*)$/);
  if(lg){ logPayment(lg[1]); return; }
  if(S.setup && /^eight:\/\/add/.test(u)){ tab='home'; render(); txSheet(null); }
}
async function boot(){
  if(NATIVE_PREFS){
    try{ const r = await NATIVE_PREFS.get({key:KEY}); if(r && r.value){ const d=JSON.parse(r.value); if(d && (d.v===1||d.v===2||d.v===3)) S=migrate(d); } }catch(e){}
  }
  checkRollover();
  const h = (location.hash||'').replace('#','');
  if(['activity','plan','profile','home'].includes(h)) tab=h;
  render();
  if(h==='add' && S.setup) txSheet(null);
  if(h.startsWith('log=')){ logPayment(h.slice(4)); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  if(window.__SHOT) shotView(String(window.__SHOT)); // App Store screenshots only
  setTimeout(()=>{ refreshRates(false).then(ok=>{ if(ok && tab==='profile' && !document.querySelector('.scrim')) render(); }); }, 1500);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refreshRates(false); });
  if(!IS_NATIVE){
    window.addEventListener('hashchange', ()=>{
      const hh=(location.hash||'').replace('#','');
      if(hh.startsWith('log=')){ logPayment(hh.slice(4)); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
      else if(hh==='add' && S.setup){ tab='home'; render(); txSheet(null); }
    });
  }
  const App = IS_NATIVE && CAP.Plugins && CAP.Plugins.App;
  if(App){
    try{ App.addListener('appUrlOpen', e=>openFromLink(e && e.url)); }catch(e){}
    try{ const l = await App.getLaunchUrl(); if(l && l.url) openFromLink(l.url); }catch(e){}
    try{ App.addListener('resume', ()=>{ checkRollover(); if(!document.querySelector('.scrim')) render(); }); }catch(e){}
  }
}
boot();
})();
</script>
